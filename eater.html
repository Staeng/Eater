<title>Eater 먹킷리스트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Jua&display=swap">
<style>
/* Layout: one column — scribble box on top, sticky filter strip, then a wrapping grid of place cards */
:root {
  --bg: #FFF4F1;
  --surface: #FFFFFF;
  --well: #FFF0EC;
  --ink: #2E2422;
  --muted: #6F5E59;
  --line: #F0D8D1;
  --accent: #FF6A55;
  --accent-ink: #FFFFFF;
  --accent-soft: #FFE2DB;
  --butter: #FFD45C;
  --butter-ink: #4A3500;
  --naver: #03C75A;
  --danger: #D93A3A;
  --shadow: 0 1px 0 rgba(78, 40, 32, .04), 0 10px 28px -14px rgba(78, 40, 32, .22);
  --shadow-lift: 0 2px 0 rgba(78, 40, 32, .04), 0 18px 36px -16px rgba(78, 40, 32, .30);

  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;

  --step--2: .8125rem;
  --step--1: .875rem;
  --step-0: 1rem;
  --step-1: 1.125rem;
  --step-2: 1.375rem;
  --step-3: 2rem;

  --r-xl: 26px;
  --r-lg: 20px;
  --r-md: 14px;
  --r-pill: 999px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1514;
    --surface: #261E1C;
    --well: #2F2522;
    --ink: #F8ECE8;
    --muted: #B39F99;
    --line: #3B2F2C;
    --accent: #FF7B67;
    --accent-ink: #2A0F0A;
    --accent-soft: #4A2620;
    --butter: #FFD45C;
    --butter-ink: #3A2A00;
    --naver: #2BD47A;
    --danger: #FF7070;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 28px -14px rgba(0, 0, 0, .7);
    --shadow-lift: 0 2px 0 rgba(0, 0, 0, .3), 0 18px 36px -16px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1514;
  --surface: #261E1C;
  --well: #2F2522;
  --ink: #F8ECE8;
  --muted: #B39F99;
  --line: #3B2F2C;
  --accent: #FF7B67;
  --accent-ink: #2A0F0A;
  --accent-soft: #4A2620;
  --butter: #FFD45C;
  --butter-ink: #3A2A00;
  --naver: #2BD47A;
  --danger: #FF7070;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 28px -14px rgba(0, 0, 0, .7);
  --shadow-lift: 0 2px 0 rgba(0, 0, 0, .3), 0 18px 36px -16px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.6;
  word-break: keep-all;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in oklab, var(--accent) 70%, transparent); outline-offset: 2px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- header ---------- */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-block: 22px 14px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { width: 44px; height: 44px; flex: none; }
.brand h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: var(--step-3);
  line-height: 1;
  letter-spacing: -.01em;
}
.brand p { margin: 2px 0 0; color: var(--muted); font-size: var(--step--1); }
.tally {
  font-family: var(--font-display);
  font-size: var(--step-0);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: var(--r-pill);
  padding: 6px 14px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.tally b { color: var(--accent); font-weight: 400; }

/* ---------- composer ---------- */
.composer {
  background: var(--surface);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow);
  padding: 18px 18px 14px;
  display: grid;
  gap: 10px;
}
.composer label.title {
  font-family: var(--font-display);
  font-size: var(--step-2);
  line-height: 1.25;
}
.composer textarea {
  width: 100%;
  min-height: 92px;
  resize: vertical;
  border: 2px solid transparent;
  background: var(--well);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  line-height: 1.6;
  transition: border-color .15s, background .15s;
}
.composer textarea::placeholder { color: var(--muted); opacity: .9; }
.composer textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.reel-row {
  display: flex;
  align-items: center;
  gap: 8px 12px;
  flex-wrap: wrap;
}
.check {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  padding: 0 4px;
  cursor: pointer;
  font-size: var(--step-0);
  user-select: none;
}
.check input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.reel-field { flex: 1 1 280px; min-width: 0; }
.reel-field input {
  width: 100%;
  height: 44px;
  border: 2px solid var(--line);
  background: var(--surface);
  border-radius: var(--r-pill);
  padding: 0 16px;
}
.reel-field input:focus { outline: none; border-color: var(--accent); }
.composer-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
  flex-wrap: wrap;
}
.tips { margin: 0; color: var(--muted); font-size: var(--step--1); min-width: 0; flex: 1 1 260px; }
.composer-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.attach-thumb {
  position: relative;
  width: 44px; height: 44px;
  border-radius: 12px;
  overflow: hidden;
  border: 2px solid var(--line);
}
.attach-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.attach-thumb button {
  position: absolute; top: 1px; right: 1px;
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 0;
  background: color-mix(in oklab, var(--ink) 75%, transparent);
  color: var(--surface);
  font-size: 12px; line-height: 18px; padding: 0;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 0;
  border-radius: var(--r-pill);
  padding: 10px 18px;
  font-family: var(--font-display);
  font-size: var(--step-0);
  line-height: 1.2;
  white-space: nowrap;
  transition: transform .12s, background .15s, box-shadow .15s;
}
.btn:active { transform: translateY(1px) scale(.98); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 16px -8px var(--accent); padding-inline: 22px; }
.btn.primary:hover { background: color-mix(in oklab, var(--accent) 88%, var(--ink)); }
.btn.primary[disabled] { opacity: .65; cursor: progress; }
.btn.ghost { background: var(--well); color: var(--ink); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.quiet { background: transparent; color: var(--muted); padding-inline: 10px; }
.btn.quiet:hover { color: var(--ink); }

.status {
  margin: 0;
  min-height: 1.4em;
  font-size: var(--step--1);
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 8px;
}
.status.warn { color: var(--danger); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: hop 1s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; background: var(--butter); }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

/* ---------- filters ---------- */
.filters {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: color-mix(in oklab, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  margin-top: 18px;
}
.filters-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.6fr) minmax(0, .9fr);
  gap: 8px;
  padding-block: 10px;
}
.field { position: relative; min-width: 0; }
.field select, .field input {
  width: 100%;
  height: 44px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  border-radius: var(--r-pill);
  padding: 0 36px 0 16px;
  appearance: none;
  -webkit-appearance: none;
  text-overflow: ellipsis;
}
.field input { padding: 0 16px 0 40px; }
.field select:hover, .field input:hover { border-color: color-mix(in oklab, var(--accent) 40%, var(--line)); }
.field select:focus, .field input:focus { outline: none; border-color: var(--accent); }
.field.has-value select { border-color: var(--accent); background: var(--accent-soft); }
.field.select::after {
  content: "";
  position: absolute;
  right: 16px; top: 50%;
  width: 7px; height: 7px;
  border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}
.field .lens {
  position: absolute; left: 14px; top: 50%;
  width: 18px; height: 18px;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}

.resultbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px 12px;
  flex-wrap: wrap;
  padding-block: 4px 12px;
  color: var(--muted);
  font-size: var(--step--1);
}
.resultbar .left, .resultbar .right { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; }
.linkbtn {
  border: 0; background: none; padding: 4px 2px;
  color: var(--ink);
  text-decoration: underline;
  text-decoration-color: color-mix(in oklab, var(--accent) 60%, transparent);
  text-underline-offset: 3px;
  text-decoration-thickness: 2px;
}
.linkbtn.danger { color: var(--danger); }

/* ---------- cards ---------- */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 18px;
  padding-bottom: 40px;
}
.card {
  --hue: #9AA0A6;
  --tint: color-mix(in oklab, var(--hue) 20%, var(--surface));
  --tint-strong: color-mix(in oklab, var(--hue) 34%, var(--surface));
  --hue-ink: color-mix(in oklab, var(--hue) 62%, var(--ink));
  position: relative;
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-width: 0;
  transition: transform .2s cubic-bezier(.3, 1.4, .5, 1), box-shadow .2s;
}
.card.linked:hover { transform: translateY(-4px) rotate(-.4deg); box-shadow: var(--shadow-lift); }
.card.pop { animation: pop .5s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes pop { from { transform: scale(.9) translateY(10px); } to { transform: none; } }
.card .stretch { position: absolute; inset: 0; z-index: 1; border-radius: inherit; }
.card .stretch:focus-visible { outline-offset: -3px; }

.photo {
  position: relative;
  aspect-ratio: 4 / 3;
  max-width: 100%;
  background-color: var(--tint);
  background-image: radial-gradient(var(--tint-strong) 1.6px, transparent 1.8px);
  background-size: 18px 18px;
  display: grid;
  place-items: center;
  overflow: hidden;
}
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo .emoji {
  font-size: 64px;
  line-height: 1;
  filter: drop-shadow(0 6px 0 color-mix(in oklab, var(--hue) 25%, transparent));
  transition: transform .25s cubic-bezier(.3, 1.6, .5, 1);
}
.card.linked:hover .photo .emoji { transform: rotate(-8deg) scale(1.08); }
.cat-chip {
  position: absolute;
  left: 10px; bottom: 10px;
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--surface);
  color: var(--hue-ink);
  border-radius: var(--r-pill);
  padding: 4px 10px 4px 8px;
  font-family: var(--font-display);
  font-size: var(--step--1);
  box-shadow: 0 2px 6px -2px rgba(0, 0, 0, .18);
}
.reel {
  position: absolute;
  right: 10px; bottom: 10px;
  z-index: 2;
  display: inline-flex; align-items: center; gap: 4px;
  min-height: 32px;
  padding: 4px 12px 4px 9px;
  border-radius: var(--r-pill);
  background: var(--ink);
  color: var(--surface);
  font-family: var(--font-display);
  font-size: var(--step--1);
  text-decoration: none;
  box-shadow: 0 3px 8px -3px rgba(0, 0, 0, .35);
  transition: transform .15s cubic-bezier(.3, 1.6, .5, 1);
}
.reel svg { width: 14px; height: 14px; color: var(--accent); }
.reel:hover { transform: scale(1.06); }
.sticker {
  position: absolute;
  right: 10px; top: 10px;
  min-width: 54px; height: 54px;
  padding: 0 8px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--butter);
  color: var(--butter-ink);
  font-family: var(--font-display);
  font-size: var(--step-1);
  line-height: 1;
  transform: rotate(8deg);
  box-shadow: 0 3px 0 color-mix(in oklab, var(--butter) 55%, var(--ink));
  font-variant-numeric: tabular-nums;
}
.sticker.today { background: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 color-mix(in oklab, var(--accent) 55%, var(--ink)); }
.sticker.past { background: var(--surface); color: var(--muted); box-shadow: none; border: 2px dashed var(--line); font-size: var(--step--1); }
.example-tag {
  position: absolute; left: 10px; top: 10px;
  background: color-mix(in oklab, var(--ink) 72%, transparent);
  color: var(--surface);
  font-size: 12px;
  letter-spacing: .04em;
  padding: 2px 8px;
  border-radius: var(--r-pill);
}

.body { padding: 14px 16px 12px; display: grid; gap: 8px; flex: 1; align-content: start; }
.name-row { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.name {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: var(--step-2);
  line-height: 1.2;
  overflow-wrap: anywhere;
  text-wrap: balance;
}
.name .undecided { font-family: var(--font-body); font-size: var(--step--2); color: var(--muted); margin-left: 6px; }
.place {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  color: var(--muted);
  font-size: var(--step--1);
}
.place svg { width: 14px; height: 14px; flex: none; color: var(--accent); }
.area-pill {
  background: var(--tint);
  color: var(--hue-ink);
  border-radius: var(--r-pill);
  padding: 1px 8px;
  font-size: var(--step--2);
  font-weight: 500;
}
.menus { display: flex; flex-wrap: wrap; gap: 6px; }
.menus span {
  background: var(--well);
  border-radius: var(--r-pill);
  padding: 3px 10px;
  font-size: var(--step--1);
  overflow-wrap: anywhere;
}
.facts {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 4px 12px;
  margin: 2px 0 0;
  font-size: var(--step-0);
}
.facts dt { color: var(--muted); font-size: var(--step--1); padding-top: 1px; }
.facts dd { margin: 0; overflow-wrap: anywhere; font-weight: 500; }
.facts dd small { display: block; color: var(--muted); font-size: var(--step--2); font-weight: 400; }
.memo {
  margin: 0;
  font-size: var(--step--1);
  color: var(--muted);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px 10px 16px;
  border-top: 1.5px dashed var(--line);
  font-size: var(--step--2);
  color: var(--muted);
}
.go { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 500; white-space: nowrap; }
.go i { width: 8px; height: 8px; border-radius: 50%; background: var(--naver); flex: none; }
.facts dd.added { font-weight: 400; color: var(--muted); font-size: var(--step--1); font-variant-numeric: tabular-nums; }
.actions { position: relative; z-index: 2; display: flex; gap: 2px; }
.icon-btn {
  width: 34px; height: 34px;
  border: 0; border-radius: 50%;
  background: transparent;
  color: var(--muted);
  display: grid; place-items: center;
}
.icon-btn svg { width: 17px; height: 17px; }
.icon-btn:hover { background: var(--well); color: var(--ink); }
.icon-btn.confirm {
  width: auto; padding: 0 12px; border-radius: var(--r-pill);
  background: var(--danger); color: var(--surface);
  font-family: var(--font-display); font-size: 13px;
}

/* ---------- empty / loading ---------- */
.empty {
  display: grid;
  justify-items: center;
  text-align: center;
  gap: 6px;
  padding: 48px 16px 64px;
  color: var(--muted);
}
.empty .bowl { font-size: 54px; line-height: 1; }
.empty h2 { margin: 6px 0 0; font-family: var(--font-display); font-weight: 400; font-size: var(--step-2); color: var(--ink); }
.empty p { margin: 0; max-width: 34ch; }

/* ---------- toast ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 30;
  display: flex; align-items: center; gap: 12px;
  max-width: calc(100% - 32px);
  background: var(--ink);
  color: var(--bg);
  border-radius: var(--r-pill);
  padding: 10px 12px 10px 18px;
  box-shadow: var(--shadow-lift);
  font-size: var(--step--1);
}
.toast button {
  border: 0; border-radius: var(--r-pill);
  background: color-mix(in oklab, var(--bg) 18%, transparent);
  color: var(--bg);
  padding: 5px 12px;
  font-family: var(--font-display);
  white-space: nowrap;
}

/* ---------- editor ---------- */
dialog.editor {
  border: 0;
  padding: 0;
  width: min(560px, calc(100% - 24px));
  max-height: calc(100% - 32px);
  border-radius: var(--r-xl);
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-lift);
}
dialog.editor::backdrop { background: rgba(30, 18, 15, .45); }
.editor form { display: grid; gap: 14px; padding: 20px; }
.editor h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: var(--step-2); }
.editor .row { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.editor label { display: grid; gap: 4px; font-size: var(--step--1); color: var(--muted); min-width: 0; }
.editor input, .editor select, .editor textarea {
  width: 100%;
  border: 1.5px solid var(--line);
  border-radius: var(--r-md);
  background: var(--well);
  padding: 10px 12px;
  color: var(--ink);
  font-size: var(--step-0);
}
.editor textarea { min-height: 64px; resize: vertical; }
.editor input:focus, .editor select:focus, .editor textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.editor .photo-edit { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.editor .photo-edit .thumb {
  width: 76px; height: 57px; border-radius: 12px; overflow: hidden;
  background: var(--well); display: grid; place-items: center; font-size: 28px;
}
.editor .photo-edit .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.editor .buttons { display: flex; justify-content: flex-end; gap: 8px; padding-top: 4px; }

@media (max-width: 720px) {
  .filters-row { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
  .filters-row .search { order: -2; }
  .filters-row #fSortWrap { order: -1; }
  .composer textarea { min-height: 112px; }
  .brand h1 { font-size: 1.75rem; }
  .composer { padding: 16px 14px 12px; border-radius: var(--r-lg); }
  .composer label.title { font-size: var(--step-1); }
  .grid { gap: 14px; }
}

        snap => { this.items = snap.docs.map(d => ({ id: d.id, ...d.data() })); this.emit(); },

      wantWhen = m[0];
    } else if ((m = rest.match(/(\d{1,2})\s*월\s*(초|중순|말|중)?/))) {
      wantWhen = m[0].trim().replace(/\s+/g, " ") + (m[2] ? "" : " 중");
    } else if ((m = rest.match(/(?<![가-힣])(월|화|수|목|금|토|일)(?:요일|욜)/))) {
      const target = wdIdx(m[1]);
      const now = (today.getDay() + 6) % 7;
      wantDate = ymd(addDays(today, ((target - now + 7) % 7) || 7));
      wantWhen = m[0];
    }
    if (m) rest = rest.replace(m[0], " ");
    const meal = rest.match(/점심|저녁|아침|브런치|야식|술자리|생일|기념일|데이트/);
    if (meal) { wantWhen = [wantWhen, meal[0]].filter(Boolean).join(" "); rest = rest.replace(meal[0], " "); }

    // menus & category
    const menus = [];
    let category = "";
    for (const c of CATS) {
      for (const w of c.words) {
        // one-letter words (회, 닭, 빵, 바 …) only count as a standalone word
        const re = w.length < 2 ? new RegExp(`(?<![가-힣])${w}(?:이|가|을|를|도|랑)?(?![가-힣])`) : new RegExp(`[가-힣]*${w}[가-힣]*`);
        const hit = rest.match(re);
        if (hit) {
          let word = hit[0];
          const stripped = word.replace(/(먹고싶|가고싶|맛집|에서|으로|이랑|하고|랑|이|가|을|를|은|는|도|에|집)$/, "");
          if (stripped.includes(w)) word = stripped;
          if (word.length <= 8 && !menus.includes(word) && word !== name) menus.push(word);
          if (!category) category = c.key;
        }
      }
    }
    for (const w of menus) rest = rest.replace(w, " ");

    if (!name) {
      const stop = /^(먹고|싶다|싶어|싶음|가고|가자|가보자|가볼|가기|에서|여기|거기|저기|꼭|진짜|너무|완전|맛집|같이|친구|랑|이랑|하고|도|좀|한번|먹으러|먹기|가서|예약|웨이팅|필수|후기|추천|요즘|핫한|유명한|ㅋ+|ㅎ+|!+|\.+|,+)$/;
      const tokens = rest.split(/[\s,.!?~·\n]+/).map(t => t.replace(/(에서|에|으로|은|는|을|를|이랑|하고|랑)$/, "")).filter(t => t && t.length >= 2 && !stop.test(t) && !/^\d/.test(t));
      if (tokens.length) name = tokens[0];
    }

    return [{ name, link, reel, address, city, gu, dong, menus: menus.slice(0, 4), category, budget, budgetLabel, wantDate, wantWhen, memo: "" }];
  }

  function guessCategory(menus, name) {
    const hay = [...menus, name].join(" ");
    for (const c of CATS) if (c.words.some(w => w.length >= 2 && hay.includes(w))) return c.key;
    return "기타";
  }

  function normalize(p, raw, rawLinks) {
    const name = str(p.name).slice(0, 60);
    const menus = (Array.isArray(p.menus) ? p.menus : []).map(str).filter(Boolean).slice(0, 6);
    const fromMemo = u => (u && rawLinks.some(r => r === u || r.startsWith(u) || u.startsWith(r)) ? u : "");
    let link = fromMemo(safeUrl(str(p.link)));
    let reel = fromMemo(safeUrl(str(p.reel)));
    if (link && isReelUrl(link)) { reel = reel || link; link = ""; }
    if (reel && !isReelUrl(reel)) { link = link || reel; reel = ""; }
    let city = str(p.city);
    city = CITY_FULL[city] || city;
    const gu = str(p.gu);
    if (!city && SEOUL_AREA[gu]) city = "서울";
    const dong = str(p.dong);
    let category = str(p.category);
    if (!CAT[category]) category = guessCategory(menus, name);
    let budget = Number(p.budget);
    budget = Number.isFinite(budget) && budget > 0 ? Math.round(budget) : null;
    const wantDate = /^\d{4}-\d{2}-\d{2}$/.test(str(p.wantDate)) ? str(p.wantDate) : null;
    return {
      name, link, reel,
      address: str(p.address).slice(0, 120),
      city, gu, dong,
      area: areaOf(city, gu, str(p.area)),
      category, menus,
      budget, budgetLabel: str(p.budgetLabel).slice(0, 40),
      wantDate, wantWhen: str(p.wantWhen).slice(0, 40),
      memo: str(p.memo).slice(0, 200),
      raw: raw.slice(0, 1000),
      createdAt: new Date().toISOString(),
      example: false,
    };
  }

  // ---------- photos ----------
  async function compress(file, maxSide, quality) {
    let src;
    try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); }
    catch {
      src = await new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => res(img);
        img.onerror = rej;
        img.src = URL.createObjectURL(file);
      });
    }
    const w = src.width || src.naturalWidth, hgt = src.height || src.naturalHeight;
    const k = Math.min(1, maxSide / Math.max(w, hgt));
    const c = document.createElement("canvas");
    c.width = Math.round(w * k); c.height = Math.round(hgt * k);
    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
    return new Promise(res => c.toBlob(res, "image/jpeg", quality));
  }
  const toDataUrl = blob => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); });
  async function storePhoto(file) {
    if (assets) {
      try {
        const blob = await compress(file, 1200, 0.85);
        const r = await assets.upload(blob, { type: "image/jpeg" });
        return { photoId: r.id, photoData: null };
      } catch { /* fall back to an inline thumbnail */ }
    }
    for (const [side, q] of [[560, 0.78], [420, 0.7], [300, 0.65]]) {
      const url = await toDataUrl(await compress(file, side, q));
      if (url.length < 180000) return { photoId: null, photoData: url };
    }
    return { photoId: null, photoData: null };
  }
  const photoSrc = p => (p.photoId ? "/_blob/" + p.photoId : p.photoData || "");

  // ---------- composer ----------
  let attached = null;
  let busy = null;
  $("photo").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    attached = f;
    $("attachImg").src = URL.createObjectURL(f);
    $("attachThumb").hidden = false;
  });
  $("attachClear").addEventListener("click", () => { attached = null; $("attachThumb").hidden = true; });
  $("hasReel").addEventListener("change", e => {
    $("reelField").hidden = !e.target.checked;
    if (e.target.checked) $("reelInput").focus();
  });
  $("raw").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); organize(); } });
  $("go").addEventListener("click", () => (busy ? busy.abort() : organize()));

  const FAIL_COPY = {
    not_granted: "Claude 사용을 허용하지 않아서 간단 정리로 담았어요.",
    sampling_disabled: "이 계정에선 Claude를 쓸 수 없어서 간단 정리로 담았어요.",
    rate_limited: "Claude 사용량이 잠깐 찼어요. 간단 정리로 담았으니 카드에서 고쳐주세요.",
    session_expired: "로그인이 만료돼서 간단 정리로 담았어요. 다시 로그인해 주세요.",
    image_rejected: "사진을 읽지 못해서 글만 보고 정리했어요.",
  };

  function setStatus(content, warn) {
    const el = $("status");
    el.replaceChildren(...(Array.isArray(content) ? content : [content || ""]));
    el.classList.toggle("warn", !!warn);
  }

  async function organize() {
    const raw = $("raw").value.trim();
    if (!raw && !attached) { setStatus("먼저 먹고 싶은 걸 적어주세요.", true); $("raw").focus(); return; }
    const reelText = $("hasReel").checked ? $("reelInput").value.trim() : "";
    const reelIn = reelText ? safeUrl(/^https?:\/\//i.test(reelText) ? reelText : "https://" + reelText) : "";
    if (reelText && !reelIn) { setStatus("릴스 링크가 올바르지 않아요. https:// 로 시작하는 주소를 붙여주세요.", true); $("reelInput").focus(); return; }
    const ctl = new AbortController();
    busy = ctl;
    $("go").textContent = "그만";
    $("raw").readOnly = true;
    setStatus([h("span", { class: "dots", "aria-hidden": "true" }, h("i"), h("i"), h("i")), sample ? "Claude가 정리하는 중…" : "정리하는 중…"]);

    const rawLinks = findUrls(raw);
    const photo = attached;
    let list = null, note = "";
    try {
      if (sample) {
        try {
          let photoBlob = null;
          if (photo && canSendImages) photoBlob = await compress(photo, 1200, 0.85).catch(() => null);
          const opts = { modelTier: "quick", signal: ctl.signal };
          if (photoBlob) opts.images = [photoBlob];
          const out = await sample.json(buildPrompt(raw || "(글 없음, 사진만 보고 정리)", !!photoBlob), opts);
          const arr = Array.isArray(out) ? out : out && Array.isArray(out.places) ? out.places : [];
          if (arr.length) list = arr;
        } catch (e) {
          if (e && e.code === "cancelled") throw e;
          if (e && ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e.code)) sample = null;
          note = FAIL_COPY[e && e.code] || "Claude 정리가 잘 안 돼서 간단 정리로 담았어요. 카드에서 고쳐주세요.";
        }
      }
      if (!list) list = localParse(raw);
      let items = list.map(p => normalize(p, raw, rawLinks));
      if (items.length === 1) {
        // one place: any link Claude left out still belongs to it
        const mapLinks = rawLinks.filter(u => !isReelUrl(u)), reelLinks = rawLinks.filter(isReelUrl);
        if (!items[0].link && mapLinks.length === 1) items[0].link = safeUrl(mapLinks[0]);
        if (!items[0].reel && reelLinks.length === 1) items[0].reel = safeUrl(reelLinks[0]);
      }
      if (reelIn && items.length) items[0].reel = reelIn;

      if (photo && items.length) {
        setStatus([h("span", { class: "dots", "aria-hidden": "true" }, h("i"), h("i"), h("i")), "사진 올리는 중…"]);
        Object.assign(items[0], await storePhoto(photo));
      }
      const ids = [];
      for (const it of items) ids.push(await store.add(it));
      fresh = new Set(ids);
      render();
      $("raw").value = "";
      $("reelInput").value = "";
      $("hasReel").checked = false;
      $("reelField").hidden = true;
      attached = null;
      $("attachThumb").hidden = true;
      setStatus(note, !!note);
      showToast(`${items.length === 1 ? (items[0].name || items[0].menus[0] || "1곳") + " 담았어요" : items.length + "곳을 담았어요"}`, "되돌리기", async () => {
        for (const id of ids) {
          const p = store.items.find(x => x.id === id);
          await store.remove(id).catch(() => {});
          if (p && p.photoId && assets) assets.delete(p.photoId).catch(() => {});
        }
        showToast("되돌렸어요");
      });
    } catch (e) {
      if (e && e.code === "cancelled") setStatus("정리를 멈췄어요. 메모는 그대로 있어요.");
      else if (e && e.code === "invalid_argument") { setStatus("이 페이지에 담을 권한이 없어요.", true); }
      else if (e && e.code === "quota_exceeded") setStatus("저장 공간이 꽉 찼어요. 다녀온 곳을 몇 개 지워주세요.", true);
      else setStatus("담지 못했어요. 잠시 뒤 다시 눌러주세요.", true);
    } finally {
      busy = null;
      $("go").textContent = "정리하기";
      $("raw").readOnly = false;
    }
  }

  // ---------- toast ----------
  let toastTimer = 0;
  function showToast(text, actionLabel, action) {
    clearTimeout(toastTimer);
    $("toastText").textContent = text;
    const btn = $("toastAction");
    btn.hidden = !actionLabel;
    btn.textContent = actionLabel || "";
    btn.onclick = action ? () => { $("toast").hidden = true; action(); } : null;
    $("toast").hidden = false;
    toastTimer = setTimeout(() => { $("toast").hidden = true; }, actionLabel ? 7000 : 3000);
  }

  // ---------- filters ----------
  const filt = { region: "", cat: "", q: "", sort: "recent" };
  try { const s = JSON.parse(localStorage.getItem("eater.sort") || "null"); if (s) { filt.sort = s; $("fSort").value = s; } } catch { /* ignore */ }
  $("fRegion").addEventListener("change", e => { filt.region = e.target.value; render(); });
  $("fCat").addEventListener("change", e => { filt.cat = e.target.value; render(); });
  $("fQ").addEventListener("input", e => { filt.q = e.target.value.trim(); render(); });
  $("fSort").addEventListener("change", e => {
    filt.sort = e.target.value;
    try { localStorage.setItem("eater.sort", JSON.stringify(filt.sort)); } catch { /* ignore */ }
    render();
  });

  function rebuildFilterOptions(items) {
    const areas = new Map();
    for (const p of items) {
      if (!p.area) continue;
      if (!areas.has(p.area)) areas.set(p.area, new Set());
      if (p.gu) areas.get(p.area).add(p.gu);
    }
    const order = a => { const i = AREA_ORDER.indexOf(a); return i < 0 ? 99 : i; };
    const sel = $("fRegion");
    const keep = filt.region;
    sel.replaceChildren(h("option", { value: "", text: "모든 지역" }));
    for (const a of [...areas.keys()].sort((x, y) => order(x) - order(y) || x.localeCompare(y, "ko"))) {
      const g = h("optgroup", { label: a });
      g.append(h("option", { value: "a:" + a, text: `${a} 전체` }));
      for (const gu of [...areas.get(a)].sort((x, y) => x.localeCompare(y, "ko"))) g.append(h("option", { value: "g:" + gu, text: gu }));
      sel.append(g);
    }
    sel.value = keep;
    if (sel.value !== keep) { sel.value = ""; filt.region = ""; }

    const used = new Set(items.map(p => p.category));
    const csel = $("fCat");
    const ckeep = filt.cat;
    csel.replaceChildren(h("option", { value: "", text: "모든 종류" }));
    for (const c of CATS) if (used.has(c.key)) csel.append(h("option", { value: c.key, text: `${c.emoji} ${c.key}` }));
    csel.value = ckeep;
    if (csel.value !== ckeep) { csel.value = ""; filt.cat = ""; }

    $("fRegionWrap").classList.toggle("has-value", !!filt.region);
    $("fCatWrap").classList.toggle("has-value", !!filt.cat);
  }

  function applyFilters(items) {
    const q = filt.q.toLowerCase();
    let out = items.filter(p => {
      if (filt.region.startsWith("a:") && p.area !== filt.region.slice(2)) return false;
      if (filt.region.startsWith("g:") && p.gu !== filt.region.slice(2)) return false;
      if (filt.cat && p.category !== filt.cat) return false;
      if (q) {
        const hay = [p.name, ...(p.menus || []), p.memo, p.gu, p.dong, p.address].join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    const byRecent = (a, b) => String(b.createdAt).localeCompare(String(a.createdAt));
    if (filt.sort === "soon") {
      const key = p => (!p.wantDate ? 3e9 : daysUntil(p.wantDate) < 0 ? 2e9 + daysUntil(p.wantDate) : daysUntil(p.wantDate));
      out.sort((a, b) => key(a) - key(b) || byRecent(a, b));
    } else if (filt.sort === "cheap") {
      out.sort((a, b) => (a.budget || 9e9) - (b.budget || 9e9) || byRecent(a, b));
    } else out.sort(byRecent);
    return out;
  }

  // ---------- cards ----------
  let fresh = new Set();
  function mapHref(p) {
    if (p.link) return { href: p.link, label: /naver\./.test(p.link) ? "네이버지도" : "지도" };
    const q = [p.name || (p.menus || [])[0], p.dong || p.gu].filter(Boolean).join(" ");
    return q ? { href: "https://map.naver.com/p/search/" + encodeURIComponent(q), label: "지도에서 찾기" } : null;
  }

  function card(p) {
    const cat = CAT[p.category] || CAT["기타"];
    const go = mapHref(p);
    const title = p.name || (p.menus || [])[0] || "이름 없는 맛집";
    const el = h("article", { class: "card" + (go ? " linked" : "") + (fresh.has(p.id) ? " pop" : ""), style: `--hue:${cat.hue}` });

    if (go) el.append(h("a", { class: "stretch", href: go.href, target: "_blank", rel: "noopener noreferrer", "aria-label": `${title} ${go.label}에서 열기` }));

    const photo = h("div", { class: "photo" });
    const src = photoSrc(p);
    const emoji = h("span", { class: "emoji", "aria-hidden": "true", text: cat.emoji });
    photo.append(emoji);
    if (src) {
      const img = h("img", { src, alt: `${title} 사진`, loading: "lazy" });
      img.addEventListener("error", () => img.remove());
      photo.append(img);
    }
    if (p.example) photo.append(h("span", { class: "example-tag", text: "예시" }));
    if (p.wantDate) {
      const n = daysUntil(p.wantDate);
      const label = n === 0 ? "오늘!" : n > 0 ? `D-${n}` : "지남";
      photo.append(h("span", { class: "sticker" + (n === 0 ? " today" : n < 0 ? " past" : ""), text: label, title: fmtDate(p.wantDate) }));
    }
    photo.append(h("span", { class: "cat-chip" }, h("span", { "aria-hidden": "true", text: cat.emoji }), cat.key));
    if (p.reel) {
      photo.append(h("a", { class: "reel", href: p.reel, target: "_blank", rel: "noopener noreferrer", "aria-label": `${title} ${reelLabel(p.reel)} 보기` },
        svg(ICON.play), reelLabel(p.reel)));
    }
    el.append(photo);

    const body = h("div", { class: "body" });
    body.append(h("div", { class: "name-row" },
      h("h3", { class: "name" }, title, !p.name && (p.menus || []).length ? h("span", { class: "undecided", text: "식당 미정" }) : null)));

    const where = [p.gu, p.dong].filter(Boolean).join(" ");
    if (where || p.area) {
      body.append(h("div", { class: "place" },
        svg(ICON.pin),
        where ? h("span", { text: where }) : null,
        p.area ? h("span", { class: "area-pill", text: p.area }) : null));
    }

    const menuList = (p.menus || []).filter(m => m !== title);
    if (menuList.length) body.append(h("div", { class: "menus", "aria-label": "먹고 싶은 메뉴" }, menuList.map(m => h("span", { text: m }))));

    const facts = h("dl", { class: "facts" });
    facts.append(h("dt", { text: "언제" }));
    if (p.wantDate) facts.append(h("dd", null, fmtDate(p.wantDate), p.wantWhen ? h("small", { text: p.wantWhen }) : null));
    else facts.append(h("dd", { text: p.wantWhen || "언젠가" }));
    facts.append(h("dt", { text: "예산" }));
    const money = p.budget ? `1인 ${fmtWon(p.budget)}` : "";
    facts.append(h("dd", null, money || p.budgetLabel || "미정", money && p.budgetLabel && p.budgetLabel !== money ? h("small", { text: p.budgetLabel }) : null));
    facts.append(h("dt", { text: "담은 날" }), h("dd", { class: "added", text: fmtShort(p.createdAt) }));
    body.append(facts);
    if (p.memo) body.append(h("p", { class: "memo", text: p.memo }));
    el.append(body);

    const foot = h("div", { class: "foot" },
      go ? h("span", { class: "go" }, h("i", { "aria-hidden": "true" }), `${go.label}에서 보기 ↗`) : h("span", { text: "지도 정보 없음" }));
    if (!readOnly) {
      const del = h("button", { class: "icon-btn", type: "button", "aria-label": `${title} 지우기` }, svg(ICON.trash));
      let armed = 0;
      del.addEventListener("click", async () => {
        if (!armed) {
          del.classList.add("confirm");
          del.replaceChildren("지울까요?");
          armed = setTimeout(() => { armed = 0; del.classList.remove("confirm"); del.replaceChildren(svg(ICON.trash)); }, 3000);
          return;
        }
        clearTimeout(armed);
        del.disabled = true;
        try {
          await store.remove(p.id);
          if (p.photoId && assets) assets.delete(p.photoId).catch(() => {});
          showToast(`${title} 지웠어요`);
        } catch { del.disabled = false; showToast("지우지 못했어요. 다시 눌러주세요."); }
      });
      foot.append(h("div", { class: "actions" },
        h("button", { class: "icon-btn", type: "button", "aria-label": `${title} 고치기`, onclick: () => openEditor(p) }, svg(ICON.edit)),
        del));
    }
    el.append(foot);
    return el;
  }

  function render() {
    const items = store.items;
    $("tally").replaceChildren(h("b", { text: String(items.filter(p => !p.example).length) }), "곳 담음");
    rebuildFilterOptions(items);
    const shown = applyFilters(items);
    $("grid").replaceChildren(...shown.map(card));
    fresh = new Set();

    const empty = $("empty");
    if (store.mode === "loading") {
      empty.hidden = false;
      $("emptyTitle").textContent = "불러오는 중";
      $("emptyText").textContent = "담아둔 맛집을 가져오고 있어요.";
    } else if (!items.length) {
      empty.hidden = false;
      $("emptyTitle").textContent = "아직 담은 곳이 없어요";
      $("emptyText").textContent = "위 칸에 먹고 싶은 걸 아무렇게나 적고 ‘정리하기’를 눌러보세요. 네이버지도 링크를 붙이면 카드에서 바로 열려요.";
    } else if (!shown.length) {
      empty.hidden = false;
      $("emptyTitle").textContent = "조건에 맞는 곳이 없어요";
      $("emptyText").textContent = "지역이나 종류를 바꾸거나 검색어를 지워보세요.";
    } else empty.hidden = true;

    const bar = $("resultbar");
    bar.hidden = !items.length;
    const filtered = filt.region || filt.cat || filt.q;
    $("resultCount").replaceChildren(
      filtered ? `${items.length}곳 중 ${shown.length}곳` : `전체 ${items.length}곳`,
      filtered ? h("button", { class: "linkbtn", type: "button", text: "필터 풀기", onclick: clearFilters }) : "");
    const ex = items.filter(p => p.example);
    const extra = $("resultExtra");
    extra.replaceChildren();
    if (ex.length && !readOnly) {
      const btn = h("button", { class: "linkbtn danger", type: "button", text: "예시 카드 지우기" });
      let armed = 0;
      btn.addEventListener("click", async () => {
        if (!armed) {
          btn.textContent = `예시 ${ex.length}개를 지울까요? 한 번 더 누르기`;
          armed = setTimeout(() => { armed = 0; btn.textContent = "예시 카드 지우기"; }, 3500);
          return;
        }
        clearTimeout(armed);
        btn.disabled = true;
        for (const p of ex) await store.remove(p.id).catch(() => {});
        showToast("예시 카드를 지웠어요");
      });
      extra.append(h("span", { text: `예시 ${ex.length}개 포함` }), btn);
    }
  }
  function clearFilters() {
    filt.region = ""; filt.cat = ""; filt.q = "";
    $("fRegion").value = ""; $("fCat").value = ""; $("fQ").value = "";
    render();
  }

  // ---------- editor ----------
  const ed = $("editor");
  let editing = null;
  let edPhoto;
  $("edCat").append(...CATS.map(c => h("option", { value: c.key, text: `${c.emoji} ${c.key}` })));
  $("edCity").append(h("option", { value: "", text: "선택 안 함" }), ...CITIES.map(c => h("option", { value: c, text: c })));

  function edThumb(src, catKey) {
    const t = $("edThumb");
    t.replaceChildren(src ? h("img", { src, alt: "" }) : (CAT[catKey] || CAT["기타"]).emoji);
  }
  function openEditor(p) {
    editing = p;
    edPhoto = undefined;
    $("edName").value = p.name || "";
    $("edCat").value = CAT[p.category] ? p.category : "기타";
    $("edLink").value = p.link || "";
    $("edReel").value = p.reel || "";
    $("edMenus").value = (p.menus || []).join(", ");
    $("edCity").value = CITIES.includes(p.city) ? p.city : "";
    $("edGu").value = p.gu || "";
    $("edDong").value = p.dong || "";
    $("edDate").value = p.wantDate || "";
    $("edWhen").value = p.wantWhen || "";
    $("edBudget").value = p.budget || "";
    $("edBudgetLabel").value = p.budgetLabel || "";
    $("edMemo").value = p.memo || "";
    edThumb(photoSrc(p), p.category);
    if (typeof ed.showModal === "function") ed.showModal(); else ed.setAttribute("open", "");
    $("edName").focus();
  }
  $("edPhoto").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    edPhoto = f;
    edThumb(URL.createObjectURL(f), $("edCat").value);
  });
  $("edPhotoClear").addEventListener("click", () => { edPhoto = null; edThumb("", $("edCat").value); });
  $("edCat").addEventListener("change", () => { if (edPhoto === null || (edPhoto === undefined && !photoSrc(editing))) edThumb("", $("edCat").value); });
  $("edCancel").addEventListener("click", () => ed.close());
  $("edForm").addEventListener("submit", async e => {
    e.preventDefault();
    if (!editing) return;
    const p = editing;
    const save = $("edSave");
    save.disabled = true;
    save.textContent = "저장 중…";
    try {
      const city = $("edCity").value;
      const gu = $("edGu").value.trim();
      let budget = Number($("edBudget").value);
      const patch = {
        name: $("edName").value.trim(),
        category: $("edCat").value,
        link: safeUrl($("edLink").value.trim()),
        reel: safeUrl($("edReel").value.trim()),
        menus: $("edMenus").value.split(/[,，、]/).map(s => s.trim()).filter(Boolean).slice(0, 6),
        city: city || (SEOUL_AREA[gu] ? "서울" : ""),
        gu,
        dong: $("edDong").value.trim(),
        wantDate: $("edDate").value || null,
        wantWhen: $("edWhen").value.trim(),
        budget: Number.isFinite(budget) && budget > 0 ? Math.round(budget) : null,
        budgetLabel: $("edBudgetLabel").value.trim(),
        memo: $("edMemo").value.trim(),
        example: false,
      };
      patch.area = areaOf(patch.city, patch.gu, "");
      const oldPhotoId = p.photoId;
      if (edPhoto) Object.assign(patch, await storePhoto(edPhoto));
      else if (edPhoto === null) Object.assign(patch, { photoId: null, photoData: null });
      await store.update(p.id, patch);
      if (edPhoto !== undefined && oldPhotoId && assets) assets.delete(oldPhotoId).catch(() => {});
      ed.close();
      showToast("고쳤어요");
    } catch {
      showToast("저장하지 못했어요. 다시 눌러주세요.");
    } finally {
      save.disabled = false;
      save.textContent = "저장";
    }
  });

  store.on(render);
  render();
  boot();
})();
</script>
