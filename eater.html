<title>Eater 먹킷리스트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: phone-first single column — composer card, sticky search + 3 filters, then a list of
   horizontal place cards (info left, square photo right); 2–3 columns of the same cards on wide screens.
   Look: Apple's iPhone pages — light grey ground with a soft colour glow at the top, white cards,
   frosted sticky bar, and one brand gradient (wordmark, main button, the composer while Claude works).
   Tokens are documented in DESIGN.md. Light theme only, by request. */
@font-face { font-family: "Paperlogy"; src: url("fonts/Paperlogy-4Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Paperlogy"; src: url("fonts/Paperlogy-6SemiBold.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: "Paperlogy"; src: url("fonts/Paperlogy-8ExtraBold.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: swap; }

:root {
  --ground: #F5F5F7;
  --paper: #FFFFFF;
  --well: #F2F2F7;
  --line: #E5E5EA;
  --ink: #1D1D1F;
  --ink-2: #6E6E73;
  --glass: rgb(245 245 247 / .78);
  /* brand gradient: light for borders and glow, deeper versions where text must stay readable */
  --grad: linear-gradient(100deg, #FF8A4C, #FF4F8B 35%, #A35BFF 68%, #4C8DFF);
  --grad-loop: linear-gradient(90deg, #FF8A4C, #FF4F8B, #A35BFF, #4C8DFF, #FF8A4C);
  --grad-text: linear-gradient(100deg, #F0552B, #E23A7A 40%, #8A3FF0 75%, #3D6BF0);
  --grad-btn: linear-gradient(100deg, #D9301F, #C9306A 55%, #7A3BE0);
  --tomato: #DF3427;
  --tomato-soft: #FFE3E0;
  --tomato-ink: #B3261B;
  --butter: #FFD84D;
  --butter-ink: #4A3600;
  --leaf: #0E9F5F;
  --leaf-soft: #E2F5EB;
  --leaf-ink: #0A6B40;
  --grape-soft: #ECEAFF;
  --grape-ink: #4A3FB5;
  --danger: #C42B20;
  --shadow: 0 1px 2px rgb(0 0 0 / .04), 0 10px 28px -18px rgb(0 0 0 / .22);

  --font: "Paperlogy", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --t-logo: 1.75rem;
  --t-title: 1.125rem;
  --t-body: 1rem;
  --t-value: .9375rem;
  --t-small: .875rem;
  --t-label: .8125rem;

  --r-pill: 999px;
  --r-thumb: 14px;
  --r-photo: 18px;
  --r-card: 24px;

  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  /* the glow at the top of Apple's iPhone pages, fading into the grey ground */
  background:
    radial-gradient(480px 340px at 0% -40px, rgb(255 138 76 / .28), transparent 70%),
    radial-gradient(520px 360px at 55% -140px, rgb(255 79 139 / .20), transparent 70%),
    radial-gradient(520px 400px at 100% -60px, rgb(120 110 255 / .26), transparent 70%),
    var(--ground);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--t-body);
  line-height: 1.6;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--glass);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--tomato); outline-offset: 2px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 20px 14px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { width: 46px; height: 46px; flex: none; transform: rotate(-6deg); }
.brand h1 {
  display: inline-block;
  margin: 0;
  font-size: var(--t-logo);
  font-weight: 800;
  line-height: 1.15;
  letter-spacing: -.04em;
  background: var(--grad-text);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}
.brand p { margin: 4px 0 0; color: var(--ink-2); font-size: var(--t-label); line-height: 1.35; }
.tally {
  flex: none;
  font-size: var(--t-small);
  font-weight: 600;
  background: var(--paper);
  border-radius: var(--r-pill);
  box-shadow: var(--shadow);
  padding: 7px 14px;
  font-variant-numeric: tabular-nums;
}
.tally b { color: var(--tomato); font-weight: 800; }
.notice {
  margin: 0 0 12px;
  padding: 10px 14px;
  border-radius: 14px;
  background: var(--paper);
  border: 1px dashed var(--line);
  color: var(--ink-2);
  font-size: var(--t-small);
}

/* ---------- composer ---------- */
.composer {
  position: relative;
  background: var(--paper);
  border: 2px solid transparent;
  border-radius: var(--r-card);
  box-shadow: var(--shadow);
  padding: 16px;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 10px;
}
/* gradient edge while writing; while Claude organizes it flows and glows, like Siri */
.composer:focus-within, .composer.thinking {
  background: linear-gradient(var(--paper), var(--paper)) padding-box, var(--grad-loop) border-box;
  background-size: auto, 200% 100%;
}
.composer.thinking { animation: flow 2.4s linear infinite; }
.composer.thinking::after {
  content: "";
  position: absolute; inset: 8px; z-index: -1;
  border-radius: inherit;
  background: var(--grad-loop);
  background-size: 200% 100%;
  filter: blur(22px);
  opacity: .55;
  animation: glow 2.4s linear infinite;
}
@keyframes flow { from { background-position: 0 0, 0% 0; } to { background-position: 0 0, 200% 0; } }
@keyframes glow { from { background-position: 0% 0; } to { background-position: 200% 0; } }
.composer .title { font-size: var(--t-title); font-weight: 800; line-height: 1.3; }
.composer textarea {
  width: 100%;
  min-height: 84px;
  resize: vertical;
  border: 2px solid transparent;
  background: var(--well);
  border-radius: var(--r-thumb);
  padding: 12px 14px;
  line-height: 1.55;
}
.composer textarea::placeholder, .field input::placeholder, .reel-field input::placeholder { color: var(--ink-2); opacity: 1; }
.composer textarea:focus { outline: none; border-color: var(--line); background: var(--paper); }
.reel-row { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; font-size: var(--t-value); user-select: none; }
.check input { width: 20px; height: 20px; margin: 0; accent-color: var(--tomato); cursor: pointer; }
.reel-field { flex: 1 1 260px; min-width: 0; }
.reel-field input {
  width: 100%;
  height: 44px;
  border: 1.5px solid var(--line);
  background: var(--paper);
  border-radius: var(--r-pill);
  padding: 0 16px;
}
.reel-field input:focus { outline: none; border-color: var(--tomato); }
.composer-bar { display: flex; align-items: center; gap: 8px; }
.tips { margin: 0; color: var(--ink-2); font-size: var(--t-small); line-height: 1.45; }
body.has-items .composer:not(:focus-within) .tips { display: none; }
.attach-thumb { position: relative; width: 44px; height: 44px; border-radius: 12px; overflow: hidden; flex: none; border: 1.5px solid var(--line); }
.attach-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.attach-thumb button {
  position: absolute; inset: auto 0 0 auto;
  width: 22px; height: 22px; padding: 0;
  border: 0; border-radius: 8px 0 0 0;
  background: var(--ink); color: var(--paper);
  font-size: 13px; line-height: 22px;
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px;
  border: 0;
  border-radius: var(--r-pill);
  padding: 0 18px;
  font-size: var(--t-value);
  font-weight: 600;
  white-space: nowrap;
  transition: transform .12s, background-color .15s;
}
.btn:active { transform: scale(.97); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--grad-btn); color: #FFFFFF; font-weight: 800; font-size: var(--t-body); padding-inline: 24px; }
.btn.primary:hover { filter: brightness(.94); }
.btn.primary[disabled] { opacity: .6; cursor: progress; }
.btn.secondary { background: var(--well); color: var(--ink); }
.btn.secondary:hover { background: var(--tomato-soft); }
.btn.quiet { background: transparent; color: var(--ink-2); padding-inline: 12px; }
.btn.quiet:hover { color: var(--ink); }
.composer-bar .grow { flex: 1; }
input[type=file].sr-only:focus-visible + label { outline: 3px solid var(--tomato); outline-offset: 2px; }

.status { margin: 0; min-height: 1.45em; font-size: var(--t-small); line-height: 1.45; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.status:empty { display: none; }
.status.warn { color: var(--danger); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--tomato); animation: hop 1s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; background: var(--butter); }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

/* ---------- lock ---------- */
.lock { background: var(--paper); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 20px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; max-width: 420px; }
.lock h2 { margin: 0; font-size: var(--t-title); font-weight: 800; }
.lock p { margin: 0; color: var(--ink-2); font-size: var(--t-small); }
.lock form { display: flex; gap: 8px; }
.lock input { flex: 1; width: 0; min-width: 0; height: 44px; border: 1.5px solid var(--line); border-radius: var(--r-pill); padding: 0 16px; background: var(--well); }
.lock input:focus { outline: none; border-color: var(--tomato); background: var(--paper); }

/* ---------- filters ---------- */
.filters {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--glass);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  margin-top: 12px;
  border-bottom: 1px solid transparent;
  transition: border-color .2s;
}
.filters.stuck { border-bottom-color: var(--line); }
.filters-row {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) repeat(3, minmax(0, 1fr));
  gap: 8px;
  padding-block: 10px;
}
.field { position: relative; min-width: 0; }
.field select, .field input {
  width: 100%;
  height: 44px;
  border: 1.5px solid transparent;
  background: var(--paper);
  box-shadow: 0 1px 2px rgb(0 0 0 / .06);
  border-radius: var(--r-pill);
  padding: 0 30px 0 14px;
  appearance: none;
  -webkit-appearance: none;
  font-size: var(--t-value);
  text-overflow: ellipsis;
  white-space: nowrap;
}
.field input { padding: 0 14px 0 40px; }
.field select:focus, .field input:focus { outline: none; border-color: var(--tomato); }
.field.on select { border-color: var(--tomato); background: var(--tomato-soft); font-weight: 600; }
.field.select::after {
  content: "";
  position: absolute; right: 14px; top: 50%;
  width: 7px; height: 7px;
  border-right: 2px solid var(--ink-2);
  border-bottom: 2px solid var(--ink-2);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}
.field .lens { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--ink-2); pointer-events: none; }

.resultbar {
  display: flex; align-items: center; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap;
  padding-block: 2px 10px;
  color: var(--ink-2);
  font-size: var(--t-small);
}
.resultbar > div { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; }
.linkbtn {
  border: 0; background: none; padding: 8px 2px;
  color: var(--tomato); font-weight: 600;
  text-decoration: underline; text-underline-offset: 3px;
}
.linkbtn.danger { color: var(--danger); }

/* ---------- cards ---------- */
.list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
  gap: 12px;
  align-items: start;
  padding-bottom: 48px;
}
.card {
  --hue: #9AA0A6;
  --tint: color-mix(in oklab, var(--hue) 16%, var(--paper));
  --tint-dot: color-mix(in oklab, var(--hue) 28%, var(--paper));
  --hue-ink: color-mix(in oklab, var(--hue) 52%, var(--ink));
  --tilt: 2.5deg;
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 108px;
  grid-template-areas: "info thumb" "foot foot";
  gap: 0 14px;
  padding: 16px 16px 6px 18px;
  background: var(--paper);
  border-radius: var(--r-card);
  box-shadow: var(--shadow);
  min-width: 0;
}
.card.pop { animation: pop .45s cubic-bezier(.3, 1.4, .5, 1); }
@keyframes pop { from { transform: translateY(8px) scale(.97); opacity: .4; } to { transform: none; opacity: 1; } }
.card .stretch { position: absolute; inset: 0; z-index: 1; border-radius: inherit; }
.card .stretch:focus-visible { outline-offset: -3px; }
.card.linked:active { transform: scale(.99); }

.info { grid-area: info; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; align-content: start; }
.tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cat {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--tint);
  color: var(--hue-ink);
  border-radius: var(--r-pill);
  padding: 2px 9px 2px 7px;
  font-size: var(--t-label);
  font-weight: 600;
  line-height: 1.5;
}
.example { font-size: var(--t-label); font-weight: 600; color: var(--ink-2); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 1px 8px; }
.name {
  margin: 2px 0 0;
  font-size: var(--t-title);
  font-weight: 800;
  line-height: 1.3;
  letter-spacing: -.01em;
  text-wrap: balance;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.book { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 2px 0; }
.ct-btn {
  position: relative; z-index: 2;
  display: inline-flex; align-items: center; gap: 4px;
  min-height: 28px;
  padding: 0 11px 0 9px;
  border-radius: var(--r-pill);
  color: var(--tomato-ink);
  background: var(--tomato-soft);
  font-size: var(--t-label);
  font-weight: 800;
  text-decoration: none;
  white-space: nowrap;
}
.ct-btn svg { width: 14px; height: 14px; flex: none; }
.ct-btn::after { content: ""; position: absolute; inset: -8px -3px; }
.ct-btn:hover { background: color-mix(in oklab, var(--tomato-soft) 80%, var(--tomato)); }
.ct-btn.tb { background: var(--grape-soft); color: var(--grape-ink); }
.ct-btn.tb:hover { background: color-mix(in oklab, var(--grape-soft) 85%, var(--grape-ink)); }
.name .undecided { font-size: var(--t-label); font-weight: 600; color: var(--ink-2); margin-left: 6px; letter-spacing: 0; }
.where { margin: 0; display: flex; align-items: center; gap: 4px 6px; flex-wrap: wrap; font-size: var(--t-small); color: var(--ink-2); line-height: 1.45; }
.where svg { width: 14px; height: 14px; flex: none; color: var(--tomato); }
.area { color: var(--ink); font-weight: 600; }
.dist { color: var(--tomato); font-weight: 600; font-variant-numeric: tabular-nums; }
.menus { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.menus li { background: var(--well); border-radius: 8px; padding: 2px 8px; font-size: var(--t-small); font-weight: 600; line-height: 1.5; }
.facts { margin: 4px 0 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; font-size: var(--t-small); line-height: 1.45; }
.facts dt { color: var(--ink-2); }
.facts dd { margin: 0; font-weight: 600; }
.facts dd small { display: block; font-size: var(--t-label); font-weight: 400; color: var(--ink-2); }
.memo { margin: 2px 0 0; font-size: var(--t-small); color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* the photo is a snapshot taped onto the card: tilted (alternating per card), with a strip of
   washi tape in the category's colour. This is the one decorative move; the rest stays quiet. */
.snap {
  grid-area: thumb;
  position: relative;
  align-self: start;
  width: 108px;
  max-width: 100%;
  margin-top: 4px;
  transform: rotate(var(--tilt));
}
.list > .card:nth-child(even) { --tilt: -2.5deg; }
.tape {
  position: absolute; left: -12px; top: 10px; z-index: 1;
  width: 46px; height: 16px;
  background: color-mix(in oklab, var(--hue) 45%, var(--paper));
  opacity: .85;
  transform: rotate(-38deg);
  border-radius: 2px;
}
.thumb {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  border-radius: var(--r-photo);
  box-shadow: 0 8px 16px -8px rgb(90 30 20 / .45);
  overflow: hidden;
  background-color: var(--tint);
  background-image: radial-gradient(var(--tint-dot) 1.4px, transparent 1.6px);
  background-size: 14px 14px;
  display: grid;
  place-items: center;
}
.thumb .emoji { font-size: 46px; line-height: 1; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.sticker {
  position: absolute; right: -10px; top: -10px; z-index: 1;
  min-width: 46px; height: 46px; padding: 0 6px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--butter);
  color: var(--butter-ink);
  font-size: var(--t-value);
  font-weight: 800;
  line-height: 1;
  transform: rotate(10deg);
  box-shadow: 0 2px 0 rgb(74 54 0 / .25);
  font-variant-numeric: tabular-nums;
}
.sticker.today { background: var(--tomato); color: #FFFFFF; box-shadow: 0 2px 0 rgb(120 20 10 / .3); }
.sticker.past { background: var(--paper); color: var(--ink-2); box-shadow: none; border: 1.5px dashed var(--line); font-size: var(--t-label); }

.foot {
  grid-area: foot;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin-top: 12px;
  padding-top: 4px;
  border-top: 1.5px dashed var(--line);
  font-size: var(--t-label);
  color: var(--ink-2);
}
.foot .left, .foot .right { display: flex; align-items: center; gap: 4px; }
.foot .left { min-height: 44px; }
.go { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px 0 0; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
.go svg { width: 14px; height: 14px; color: var(--leaf); }
/* small phones: with a reel pill the footer is full, so the map hint keeps only its pin */
@media (max-width: 380px) { .foot .left:has(.reel) .go span { display: none; } }
.reel {
  position: relative; z-index: 2;
  display: inline-flex; align-items: center; gap: 4px;
  min-height: 32px;
  padding: 0 11px 0 9px;
  margin-right: 2px;
  border-radius: var(--r-pill);
  background: var(--tomato-soft);
  color: var(--ink);
  font-weight: 800;
  text-decoration: none;
  white-space: nowrap;
}
.reel::after { content: ""; position: absolute; inset: -6px 0; }
.reel svg { width: 13px; height: 13px; color: var(--tomato); }
.icon-btn {
  position: relative; z-index: 2;
  width: 44px; height: 44px;
  border: 0; border-radius: 50%;
  background: transparent;
  color: var(--ink-2);
  display: grid; place-items: center;
}
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn:hover { background: var(--well); color: var(--ink); }
.icon-btn.confirm { width: auto; padding: 0 12px; border-radius: var(--r-pill); background: var(--danger); color: #FFFFFF; font-weight: 800; font-size: var(--t-label); }

/* ---------- empty ---------- */
.empty { display: grid; justify-items: center; text-align: center; gap: 6px; padding: 40px 16px 64px; color: var(--ink-2); }
.empty .bowl { font-size: 48px; line-height: 1; }
.empty h2 { margin: 6px 0 0; font-size: var(--t-title); font-weight: 800; color: var(--ink); }
.empty p { margin: 0; max-width: 32ch; font-size: var(--t-small); }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; z-index: 30;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 12px;
  width: max-content; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--paper);
  border-radius: var(--r-pill);
  padding: 8px 8px 8px 18px;
  box-shadow: 0 10px 30px -10px rgb(42 38 48 / .5);
  font-size: var(--t-small);
  font-weight: 600;
}

      document.addEventListener("visibilitychange", () => { if (!document.hidden) store.refresh(); });
    } catch (e) {
      if (e instanceof ApiError && e.status === 401) return showLock();
      if (e instanceof ApiError && e.status === 503) {
        parseOnServer = true;
        canSendImages = true;
        showNotice("서버 저장소가 아직 연결되지 않아서 이 기기에만 저장돼요. Vercel에서 Upstash Redis를 연결하면 폰과 PC가 같은 목록을 봐요.");
      }
      store.useLocal();
    }
  }

  function showNotice(text) { $("notice").textContent = text; $("notice").hidden = false; }

  function showLock(message) {
    $("composer").hidden = true;
    $("lock").hidden = false;
    $("lockMsg").textContent = message || "";
    store.mode = "locked";
    render();
    $("lockInput").focus();
  }
  $("lockForm").addEventListener("submit", async e => {
    e.preventDefault();
    setPass($("lockInput").value);
    $("lockMsg").textContent = "";
    try {
      await api("GET", "/api/places");
      $("lockInput").value = "";
      bootServer();
    } catch (err) {
      $("lockMsg").textContent = err instanceof ApiError && err.status === 401 ? "비밀번호가 맞지 않아요. 다시 입력해 주세요." : "서버에 연결하지 못했어요. 잠시 뒤 다시 시도해 주세요.";

  });

      "[메모]",
      '"""',
      raw,
      '"""',
    ].filter(l => l !== null).join("\n");
  }

  // ---------- offline parser (used when Claude isn't reachable) ----------
  function localParse(raw) {
    const text = raw.replace(/\r/g, "");
    const urls = findUrls(text);
    const reel = urls.find(isReelUrl) || "";
    const link = urls.find(u => /naver\.(me|com)/.test(u)) || urls.find(u => !isReelUrl(u)) || "";
    let name = "", address = "";
    const share = text.match(/\[\s*네이버\s*지도\s*\]\s*\n+\s*([^\n]+)\n+\s*([^\n]*)/);
    if (share) {
      name = share[1].trim();
      if (!/^https?:/.test(share[2])) address = share[2].trim();
    }
    let rest = text.replace(URL_RE, " ").replace(/\[\s*네이버\s*지도\s*\]/g, " ");
    if (share) rest = rest.replace(share[1], " ").replace(address || "\u0000", " ");

    // region
    let city = "", gu = "", dong = "";
    const addrSrc = address || rest;
    const cityM = addrSrc.match(/(서울특별시|서울시|서울|경기도|경기|인천광역시|인천|부산광역시|부산|대구광역시|대구|광주광역시|대전광역시|대전|울산광역시|울산|세종특별자치시|세종|강원특별자치도|강원도|강원|충청북도|충북|충청남도|충남|전북특별자치도|전라북도|전북|전라남도|전남|경상북도|경북|경상남도|경남|제주특별자치도|제주도|제주)(?=\s|$)/);
    if (cityM) city = CITY_FULL[cityM[1]] || cityM[1];
    const guM = addrSrc.match(/([가-힣]{1,4}구)(?=\s|$|,|\))/g);
    if (guM) { const g = guM.find(x => SEOUL_AREA[x]); if (g) { gu = g; city = city || "서울"; } }
    if (!gu && city && city !== "서울") {
      const siM = addrSrc.match(/([가-힣]{1,4}[시군])(?:\s+([가-힣]{1,4}구))?/);
      if (siM) gu = [siM[1], siM[2]].filter(Boolean).join(" ");
    }
    const dongM = addrSrc.match(/([가-힣]{1,5}\d?가?동)(?=\s|$|,|\))/);
    if (dongM && !/^(이동|활동|행동|운동|감동)$/.test(dongM[1])) dong = dongM[1];
    if (!gu) {
      const hood = HOODS.find(([k]) => rest.includes(k));
      if (hood) { [, city, gu] = hood; dong = dong || hood[3]; rest = rest.replace(hood[0], " "); }
    }

    // money phrases are dropped (budget isn't tracked) so they don't end up as a name
    const won = rest.match(/(?:(1인|인당|한\s*명|둘이|두\s*명|2인|셋이|세\s*명|3인|넷이|네\s*명|4인|(\d+)\s*(?:명|인))\s*(?:이서|서|에|당)?\s*)?(?:예산\s*)?(\d+(?:\.\d+)?)\s*(만\s*원?|천\s*원?|원)/);
    if (won) rest = rest.replace(won[0], " ");

    // date
    const today = startOfDay(new Date());
    const wb = weekBounds(today);
    let wantDate = null, wantWhen = "";
    const wdIdx = c => "월화수목금토일".indexOf(c); // 월=0
    let m;
    if ((m = rest.match(/(이번\s*주|다음\s*주|담주|다다음\s*주)\s*(월|화|수|목|금|토|일)(?:요일|욜)?/))) {
      const base = /다다음/.test(m[1]) ? addDays(wb.nextMon, 7) : /다음|담/.test(m[1]) ? wb.nextMon : wb.thisMon;
      wantDate = ymd(addDays(base, wdIdx(m[2])));
      wantWhen = m[0];
    } else if ((m = rest.match(/(이번|다음|담)\s*주말/))) {
      const base = /다음|담/.test(m[1]) ? wb.nextMon : wb.thisMon;
      wantDate = ymd(addDays(base, 5));
      wantWhen = m[0];
    } else if ((m = rest.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/)) || (m = rest.match(/(?<![\d.])(\d{1,2})\/(\d{1,2})(?![\d/])/))) {
      let d = new Date(today.getFullYear(), Number(m[1]) - 1, Number(m[2]));
      if (d < today) d = new Date(today.getFullYear() + 1, Number(m[1]) - 1, Number(m[2]));
      wantDate = ymd(d);
      wantWhen = m[0];
    } else if ((m = rest.match(/오늘|내일|모레/))) {
      wantDate = ymd(addDays(today, { "오늘": 0, "내일": 1, "모레": 2 }[m[0]]));
      wantWhen = m[0];
    } else if ((m = rest.match(/(\d{1,2})\s*월\s*(초|중순|말|중)?/))) {
      wantWhen = m[0].trim().replace(/\s+/g, " ") + (m[2] ? "" : " 중");
    } else if ((m = rest.match(/(?<![가-힣])(월|화|수|목|금|토|일)(?:요일|욜)/))) {
      const target = wdIdx(m[1]);
      const now = (today.getDay() + 6) % 7;
      wantDate = ymd(addDays(today, ((target - now + 7) % 7) || 7));
      wantWhen = m[0];
    }
    if (m) rest = rest.replace(m[0], " ");
    const meal = rest.match(/점심|저녁|아침|브런치|야식|술자리|생일|기념일|데이트/);
    if (meal) { wantWhen = [wantWhen, meal[0]].filter(Boolean).join(" "); rest = rest.replace(meal[0], " "); }

    // menus & category
    const menus = [];
    let category = "";
    for (const c of CATS_MATCH) {
      for (const w of c.words) {
        // one-letter words (회, 닭, 빵, 바 …) only count as a standalone word
        const re = w.length < 2 ? new RegExp(`(?<![가-힣])${w}(?:이|가|을|를|도|랑)?(?![가-힣])`) : new RegExp(`[가-힣]*${w}[가-힣]*`);
        const hit = rest.match(re);
        if (hit) {
          let word = hit[0];
          const stripped = word.replace(/(먹고싶|가고싶|맛집|에서|으로|이랑|하고|랑|이|가|을|를|은|는|도|에|집)$/, "");
          if (stripped.includes(w)) word = stripped;
          if (word.length <= 8 && !menus.includes(word) && word !== name) menus.push(word);
          if (!category) category = c.key;
        }
      }
    }
    for (const w of menus) rest = rest.replace(w, " ");

    if (!name) {
      const stop = /^(먹고|싶다|싶어|싶음|가고|가자|가보자|가볼|가기|에서|여기|거기|저기|꼭|진짜|너무|완전|맛집|같이|친구|랑|이랑|하고|도|좀|한번|먹으러|먹기|가서|예약|웨이팅|필수|후기|추천|요즘|핫한|유명한|릴스|ㅋ+|ㅎ+|!+|\.+|,+)$/;
      const tokens = rest.split(/[\s,.!?~·\n]+/).map(t => t.replace(/(에서|에|으로|은|는|을|를|이랑|하고|랑)$/, "")).filter(t => t && t.length >= 2 && !stop.test(t) && !/^\d/.test(t));
      if (tokens.length) name = tokens[0];
    }

    return [{ name, link, reel, address, city, gu, dong, menus: menus.slice(0, 4), category, wantDate, wantWhen, memo: "" }];
  }

  function guessCategory(menus, name) {
    const hay = [...menus, name].join(" ");
    for (const c of CATS_MATCH) if (c.words.some(w => w.length >= 2 && hay.includes(w))) return c.key;
    return "기타";
  }

  function normalize(p, raw, rawLinks) {
    const name = str(p.name).slice(0, 60);
    const menus = (Array.isArray(p.menus) ? p.menus : []).map(str).filter(Boolean).slice(0, 6);
    const fromMemo = u => (u && rawLinks.some(r => r === u || r.startsWith(u) || u.startsWith(r)) ? u : "");
    let link = fromMemo(safeUrl(str(p.link)));
    let reel = fromMemo(safeUrl(str(p.reel)));
    // the server found the place on Naver by name; only accept its own link shape
    if (!link && /^https:\/\/map\.naver\.com\/p\/entry\/place\/\d+$/.test(str(p.naverLink))) link = str(p.naverLink);
    if (link && isReelUrl(link)) { reel = reel || link; link = ""; }
    if (reel && !isReelUrl(reel)) { link = link || reel; reel = ""; }
    let city = str(p.city);
    city = CITY_FULL[city] || city;
    const gu = str(p.gu);
    if (!city && SEOUL_AREA[gu]) city = "서울";
    const dong = str(p.dong);
    let category = str(p.category);
    if (!CAT[category]) category = guessCategory(menus, name);
    const lat = Number(p.lat), lng = Number(p.lng);
    const placeId = /^\d{5,15}$/.test(str(p.placeId)) ? str(p.placeId) : "";
    const wantDate = /^\d{4}-\d{2}-\d{2}$/.test(str(p.wantDate)) ? str(p.wantDate) : null;
    const photoUrl = safeUrl(str(p.photoUrl));
    return {
      name, link, reel,
      address: str(p.address).slice(0, 120),
      city, gu, dong,
      area: areaOf(city, gu, str(p.area)),
      category, menus,
      wantDate, wantWhen: str(p.wantWhen).slice(0, 40),
      memo: str(p.memo).slice(0, 200),
      raw: raw.slice(0, 1000),
      createdAt: new Date().toISOString(),
      example: false,
      ...(photoUrl.startsWith("https://") ? { photoUrl } : {}),
      ...(lat > 33 && lat < 39 && lng > 124 && lng < 132 ? { lat, lng } : {}),
      ...(placeId ? { placeId } : {}),
      ...(/^https:\/\/app\.catchtable\.co\.kr\/ct\//.test(str(p.catchtable)) ? { catchtable: str(p.catchtable) } : {}),
      ...(/^https:\/\/www\.tabling\.co\.kr\//.test(str(p.tabling)) ? { tabling: str(p.tabling), tablingMode: p.tablingMode === "예약" ? "예약" : "웨이팅" } : {}),
    };
  }

  // ---------- photos ----------
  async function compress(file, maxSide, quality) {
    let src;
    try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); }
    catch {
      src = await new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => res(img);
        img.onerror = rej;
        img.src = URL.createObjectURL(file);
      });
    }
    const w = src.width || src.naturalWidth, hgt = src.height || src.naturalHeight;
    const k = Math.min(1, maxSide / Math.max(w, hgt));
    const c = document.createElement("canvas");
    c.width = Math.round(w * k); c.height = Math.round(hgt * k);
    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
    return new Promise(res => c.toBlob(res, "image/jpeg", quality));
  }
  const toDataUrl = blob => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); });
  async function storePhoto(file) {
    const none = { photoId: null, photoKey: null, photoData: null };
    if (store.mode === "server") {
      for (const [side, q] of [[1000, 0.8], [720, 0.72]]) {
        const data = await toDataUrl(await compress(file, side, q));
        if (data.length > 880000) continue;
        const { key } = await api("POST", "/api/photo", { data });
        return { ...none, photoKey: key };
      }
      throw new ApiError(413, "bad_image");
    }
    if (assets) {
      try {
        const r = await assets.upload(await compress(file, 1000, 0.82), { type: "image/jpeg" });
        return { ...none, photoId: r.id };
      } catch { /* fall back to an inline thumbnail */ }
    }
    for (const [side, q] of [[560, 0.78], [420, 0.7], [300, 0.65]]) {
      const url = await toDataUrl(await compress(file, side, q));
      if (url.length < 180000) return { ...none, photoData: url };
    }
    return none;
  }
  function photoSrc(p) {
    if (p.photoId) return "/_blob/" + p.photoId;
    if (p.photoKey) return "/api/photo?id=" + encodeURIComponent(p.photoKey);
    return p.photoData || p.photoUrl || "";
  }

  // ---------- composer ----------
  let attached = null;
  let busy = null;
  $("photo").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    attached = f;
    $("attachImg").src = URL.createObjectURL(f);
    $("attachThumb").hidden = false;
  });
  $("attachClear").addEventListener("click", () => { attached = null; $("attachThumb").hidden = true; });
  $("hasReel").addEventListener("change", e => {
    $("reelField").hidden = !e.target.checked;
    if (e.target.checked) $("reelInput").focus();
  });
  $("raw").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); organize(); } });
  $("go").addEventListener("click", () => (busy ? busy.abort() : organize()));

    refused: "Claude가 이 메모를 정리하지 않아서 간단 정리로 담았어요.",
  };
  const FALLBACK_COPY = "Claude 정리가 실패해서 간단 정리로 담았어요. 카드에서 고쳐 주세요.";

  function setStatus(content, warn) {
    const el = $("status");
    el.replaceChildren(...(Array.isArray(content) ? content : [content || ""]));

  const working = label => [h("span", { class: "dots", "aria-hidden": "true" }, h("i"), h("i"), h("i")), label];

  // Ask Claude for the place list. Returns {list, note}; list is null when we should parse locally.
  async function askClaude(raw, photo, signal) {
    if (sample) {
      try {
        let photoBlob = null;
        if (photo && canSendImages) photoBlob = await compress(photo, 1000, 0.82).catch(() => null);
        const opts = { modelTier: "quick", signal };
        if (photoBlob) opts.images = [photoBlob];
        const out = await sample.json(buildPrompt(raw || "(글 없음, 사진만 보고 정리)", !!photoBlob), opts);
        const arr = Array.isArray(out) ? out : out && Array.isArray(out.places) ? out.places : [];
        return { list: arr.length ? arr : null, note: "" };
      } catch (e) {
        if (e && e.code === "cancelled") throw e;
        if (e && ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e.code)) sample = null;
        return { list: null, note: FAIL_COPY[e && e.code] ?? FALLBACK_COPY };
      }
    }
    if (parseOnServer) {
      try {
        let image;
        if (photo) image = await toDataUrl(await compress(photo, 1000, 0.8)).catch(() => undefined);
        const out = await api("POST", "/api/parse", { text: raw, today: ymd(new Date()), image }, signal);
        const arr = Array.isArray(out.places) ? out.places : [];
        return { list: arr.length ? arr : null, note: "" };
      } catch (e) {
        if (e && e.name === "AbortError") throw { code: "cancelled" };
        if (e instanceof ApiError && e.status === 401) { showLock("비밀번호가 바뀌었어요. 다시 입력해 주세요."); throw e; }
        if (e instanceof ApiError && e.code === "no_key") parseOnServer = false;
        return { list: null, note: FAIL_COPY[e && e.code] ?? FALLBACK_COPY };
      }
    }
    return { list: null, note: "" };
  }

  async function organize() {
    const raw = $("raw").value.trim();
    if (!raw && !attached) { setStatus("먼저 먹고 싶은 걸 적어 주세요.", true); $("raw").focus(); return; }
    const reelText = $("hasReel").checked ? $("reelInput").value.trim() : "";
    const reelIn = reelText ? safeUrl(/^https?:\/\//i.test(reelText) ? reelText : "https://" + reelText) : "";
    if (reelText && !reelIn) { setStatus("릴스 링크를 확인해 주세요. https:// 로 시작하는 주소를 붙여 주세요.", true); $("reelInput").focus(); return; }

    const ctl = new AbortController();
    busy = ctl;
    $("composer").classList.add("thinking");
    $("go").textContent = "멈추기";
    $("raw").readOnly = true;
    setStatus(working(sample || parseOnServer ? "Claude가 정리하는 중…" : "정리하는 중…"));

    const rawLinks = findUrls(raw);
    const photo = attached;
    try {
      const { list, note } = await askClaude(raw, photo, ctl.signal);
      const items = (list || localParse(raw)).map(p => normalize(p, raw, rawLinks));
      if (items.length === 1) {
        // one place: any link Claude left out still belongs to it
        const mapLinks = rawLinks.filter(u => !isReelUrl(u)), reelLinks = rawLinks.filter(isReelUrl);
        if (!items[0].link && mapLinks.length === 1) items[0].link = safeUrl(mapLinks[0]);
        if (!items[0].reel && reelLinks.length === 1) items[0].reel = safeUrl(reelLinks[0]);
      }
      if (reelIn && items.length) items[0].reel = reelIn;

      // places already on the list are not added again
      const toAdd = [], dups = [];
      for (const it of items) {
        const twin = findTwin(it, [...store.items, ...toAdd]);
        if (twin) dups.push(twin); else toAdd.push(it);
      }
      const clearComposer = () => {
        $("raw").value = "";
        $("reelInput").value = "";
        $("hasReel").checked = false;
        $("reelField").hidden = true;
        attached = null;
        $("attachThumb").hidden = true;
      };
      if (!toAdd.length) {
        clearComposer();
        setStatus("");
        showDuplicates(dups, false);
        return;
      }

      let photoNote = "";
      if (photo) {
        setStatus(working("사진 올리는 중…"));
        try { Object.assign(toAdd[0], await storePhoto(photo)); }
        catch { photoNote = "사진은 올리지 못했어요. 카드의 연필 버튼으로 다시 넣을 수 있어요."; }
      }
      const ids = [];
      for (const it of toAdd) ids.push(await store.add(it));
      fresh = new Set(ids);
      render();
      const added = document.querySelector(".card.pop");
      if (added) added.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
      clearComposer();
      const msg = [note, photoNote].filter(Boolean).join(" ");
      setStatus(msg, !!msg);
      if (dups.length) showDuplicates(dups, true);
      const first = toAdd[0].name || toAdd[0].menus[0];
      showToast(toAdd.length === 1 ? `${first ? withObj(first) : "1곳을"} 담았어요` : `${toAdd.length}곳을 담았어요`, "되돌리기", async () => {
        for (const id of ids) {
          const p = store.items.find(x => x.id === id);
          await store.remove(id).catch(() => {});
          if (p && p.photoId && assets) assets.delete(p.photoId).catch(() => {});
        }
        showToast("되돌렸어요");
      });
    } catch (e) {
      if (e && e.code === "cancelled") setStatus("정리를 멈췄어요. 적은 글은 그대로 있어요.");
      else if (e instanceof ApiError && e.status === 401) setStatus("");
      else if (e && e.code === "invalid_argument") setStatus("이 페이지에 담을 권한이 없어요.", true);
      else if (e && e.code === "quota_exceeded") setStatus("저장 공간이 꽉 찼어요. 다녀온 곳을 몇 개 지워 주세요.", true);
      else setStatus("담지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.", true);
    } finally {
      busy = null;
      $("composer").classList.remove("thinking");
      $("go").textContent = "정리해서 담기";
      $("raw").readOnly = false;
    }
  }

  // ---------- duplicates ----------
  const squash = s => String(s || "").replace(/\s+/g, "").toLowerCase();
  const linkKey = u => String(u || "").replace(/[?#].*$/, "").replace(/\/+$/, "");
  function findTwin(it, pool) {
    return pool.find(p =>
      (it.placeId && it.placeId === p.placeId) ||
      (it.link && linkKey(it.link) === linkKey(p.link)) ||
      (it.name && squash(it.name) === squash(p.name) && (!it.gu || !p.gu || it.gu === p.gu)) ||
      (!it.name && !p.name && (it.menus || [])[0] && squash(it.menus[0]) === squash((p.menus || [])[0]) && (it.dong || it.gu) === (p.dong || p.gu)));
  }
  let dupFirst = null, dupRevisit = [];
  function showDuplicates(twins, someAdded) {
    const uniq = [...new Map(twins.map(t => [t.id, t])).values()];
    dupRevisit = uniq.every(t => t.visited) ? uniq : [];
    dupFirst = uniq.find(t => !t.visited) || null;
    $("dupTitle").textContent = dupRevisit.length ? "다녀온 곳이에요" : "이미 담은 곳이에요";
    $("dupShow").textContent = dupRevisit.length ? "또 가고 싶어요" : "카드 보기";
    $("dupText").textContent = dupRevisit.length
      ? "‘다녀왔어요’에 있는 곳이에요. 또 가고 싶으면 아래 버튼을 눌러 주세요."
      : someAdded ? "나머지는 담았고, 아래 곳은 이미 목록에 있어서 담지 않았어요." : "이미 목록에 있어서 담지 않았어요.";
    $("dupList").replaceChildren(...uniq.map(t => h("li", { text: [titleOf(t), t.gu].filter(Boolean).join(" · ") })));
    const d = $("dupDialog");
    if (typeof d.showModal === "function") d.showModal(); else d.setAttribute("open", "");
  }
  $("dupShow").addEventListener("click", () => {
    $("dupDialog").close();
    if (dupRevisit.length) { dupRevisit.forEach(t => goAgain(t)); return; }
    if (!dupFirst) return;
    let el = document.querySelector(`.card[data-id="${CSS.escape(dupFirst.id)}"]`);
    if (!el) { clearFilters(); el = document.querySelector(`.card[data-id="${CSS.escape(dupFirst.id)}"]`); }
    if (!el) return;
    el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
    el.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  });

  // ---------- visited ----------
  async function markVisited(p) {
    try {
      await store.update(p.id, { visited: true, visitedAt: new Date().toISOString() });
      showToast(`${withObj(titleOf(p) || "이 곳")} 다녀온 곳으로 옮겼어요`, "되돌리기", () => store.update(p.id, { visited: false, visitedAt: null }).catch(() => {}));
    } catch { showToast("옮기지 못했어요. 다시 눌러 주세요."); }
  }
  async function goAgain(p) {
    try {
      fresh = new Set([p.id]);
      await store.update(p.id, { visited: false, visitedAt: null });
      showToast(`${withObj(titleOf(p) || "이 곳")} 다시 담았어요`);
    } catch { showToast("다시 담지 못했어요. 다시 눌러 주세요."); }

  function renderVisited(list) {
    const ul = $("visitedList");
    $("visitedEmpty").hidden = list.length > 0;
    const sorted = [...list].sort((a, b) => String(b.visitedAt || "").localeCompare(String(a.visitedAt || "")));
    ul.replaceChildren(...sorted.map(p => {
      const cat = CAT[p.category] || CAT["기타"];

      const src = photoSrc(p);
      if (src) { const img = h("img", { src, alt: "", loading: "lazy", referrerpolicy: "no-referrer" }); img.addEventListener("error", () => img.remove()); thumb.append(img); }
      const when = p.visitedAt ? (d => `${d.getMonth() + 1}월 ${d.getDate()}일 다녀옴`)(new Date(p.visitedAt)) : "다녀옴";

  function openVisited() {

  }
  $("visitedClose").addEventListener("click", () => $("visitedDialog").close());

  // ---------- toast ----------
  let toastTimer = 0;
  function showToast(text, actionLabel, action) {
    clearTimeout(toastTimer);
    $("toastText").textContent = text;
    const btn = $("toastAction");
    btn.hidden = !actionLabel;
    btn.textContent = actionLabel || "";
    btn.onclick = action ? () => { $("toast").hidden = true; action(); } : null;
    $("toast").hidden = false;
    toastTimer = setTimeout(() => { $("toast").hidden = true; }, actionLabel ? 7000 : 3000);
  }

  // ---------- filters ----------
  // every visit starts in 등록순 (newest first); a different sort lasts until the page reloads
  const filt = { region: "", cat: "", q: "", sort: "recent" };
  $("fSort").value = filt.sort;
  $("fRegion").addEventListener("change", e => { filt.region = e.target.value; render(); });
  $("fCat").addEventListener("change", e => { filt.cat = e.target.value; render(); });
  $("fQ").addEventListener("input", e => { filt.q = e.target.value.trim(); render(); });
  $("fSort").addEventListener("change", e => { filt.sort = e.target.value; render(); });
  // hairline under the filter bar once it sticks
  const sentinel = h("div", { "aria-hidden": "true" });
  $("filters").before(sentinel);
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(([e]) => $("filters").classList.toggle("stuck", !e.isIntersecting)).observe(sentinel);
  }

  function rebuildFilterOptions(items) {
    const areas = new Map();
    for (const p of items) {
      if (!p.area) continue;
      if (!areas.has(p.area)) areas.set(p.area, new Set());
      if (p.gu) areas.get(p.area).add(p.gu);
    }
    const order = a => { const i = AREA_ORDER.indexOf(a); return i < 0 ? 99 : i; };
    const sel = $("fRegion");
    const keep = filt.region;
    sel.replaceChildren(h("option", { value: "", text: "모든 지역" }));
    for (const a of [...areas.keys()].sort((x, y) => order(x) - order(y) || x.localeCompare(y, "ko"))) {
      const g = h("optgroup", { label: a });
      g.append(h("option", { value: "a:" + a, text: `${a} 전체` }));
      for (const gu of [...areas.get(a)].sort((x, y) => x.localeCompare(y, "ko"))) g.append(h("option", { value: "g:" + gu, text: gu }));
      sel.append(g);
    }
    sel.value = keep;
    if (sel.value !== keep) { sel.value = ""; filt.region = ""; }

    const used = new Set(items.map(p => p.category));
    const csel = $("fCat");
    const ckeep = filt.cat;
    csel.replaceChildren(h("option", { value: "", text: "모든 종류" }));
    for (const c of CATS) if (used.has(c.key)) csel.append(h("option", { value: c.key, text: `${c.emoji} ${c.key}` }));
    csel.value = ckeep;
    if (csel.value !== ckeep) { csel.value = ""; filt.cat = ""; }

    $("fRegionWrap").classList.toggle("on", !!filt.region);
    $("fCatWrap").classList.toggle("on", !!filt.cat);
  }

  function applyFilters(items) {
    const q = filt.q.toLowerCase();
    const out = items.filter(p => {
      if (filt.region.startsWith("a:") && p.area !== filt.region.slice(2)) return false;
      if (filt.region.startsWith("g:") && p.gu !== filt.region.slice(2)) return false;
      if (filt.cat && p.category !== filt.cat) return false;
      if (q) {
        const hay = [p.name, ...(p.menus || []), p.memo, p.gu, p.dong, p.address].join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    const byName = (a, b) => titleOf(a).localeCompare(titleOf(b), "ko");
    if (filt.sort === "soon") {
      const key = p => (!p.wantDate ? 3e9 : daysUntil(p.wantDate) < 0 ? 2e9 + daysUntil(p.wantDate) : daysUntil(p.wantDate));
      out.sort((a, b) => key(a) - key(b) || byName(a, b));
    } else if (filt.sort === "near") {
      const km = p => kmFromSangam(p) ?? 1e9;
      out.sort((a, b) => km(a) - km(b) || byName(a, b));
    } else if (filt.sort === "name") out.sort(byName);
    else out.sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")) || byName(a, b));
    return out;
  }

  // 상암동(DMC) 기준 거리. 네이버 좌표가 없으면 구청 위치로 어림한다.
  const SANGAM = [37.5784, 126.8897];
  const GU_CENTER = {
    "종로구": [37.5735, 126.9790], "중구": [37.5641, 126.9979], "용산구": [37.5326, 126.9905],
    "성동구": [37.5634, 127.0368], "광진구": [37.5385, 127.0823], "동대문구": [37.5744, 127.0396],
    "중랑구": [37.6066, 127.0927], "성북구": [37.5894, 127.0167], "강북구": [37.6396, 127.0257],
    "도봉구": [37.6688, 127.0471], "노원구": [37.6542, 127.0568], "은평구": [37.6027, 126.9291],
    "서대문구": [37.5791, 126.9368], "마포구": [37.5663, 126.9019], "양천구": [37.5170, 126.8665],
    "강서구": [37.5509, 126.8495], "구로구": [37.4954, 126.8874], "금천구": [37.4569, 126.8955],
    "영등포구": [37.5264, 126.8962], "동작구": [37.5124, 126.9393], "관악구": [37.4784, 126.9516],
    "서초구": [37.4837, 127.0324], "강남구": [37.5172, 127.0473], "송파구": [37.5145, 127.1059],
    "강동구": [37.5301, 127.1238],
  };
  function kmFromSangam(p) {
    const at = Number.isFinite(p.lat) && Number.isFinite(p.lng) ? [p.lat, p.lng] : GU_CENTER[p.gu];
    if (!at) return null;
    const rad = d => d * Math.PI / 180;
    const dLat = rad(at[0] - SANGAM[0]), dLng = rad(at[1] - SANGAM[1]);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(SANGAM[0])) * Math.cos(rad(at[0])) * Math.sin(dLng / 2) ** 2;
    return 6371 * 2 * Math.asin(Math.sqrt(a));
  }
  const titleOf = p => p.name || (p.menus || [])[0] || "";

  // ---------- cards ----------
  let fresh = new Set();
  function mapHref(p) {
    if (p.link) {
      const label = /naver\./.test(p.link) ? "네이버지도" : "지도";

    }
    const q = [p.name || (p.menus || [])[0], p.dong || p.gu].filter(Boolean).join(" ");
    return q ? { href: "https://map.naver.com/p/search/" + encodeURIComponent(q), label: "지도에서 찾기", says: "네이버지도에서 찾기" } : null;
  }

  function card(p) {
    const cat = CAT[p.category] || CAT["기타"];

    const el = h("article", { class: "card" + (go ? " linked" : "") + (fresh.has(p.id) ? " pop" : ""), style: `--hue:${cat.hue}`, "data-id": p.id });
    if (go) el.append(h("a", { class: "stretch", href: go.href, target: "_blank", rel: "noopener noreferrer", "aria-label": `${title}, ${go.says}` }));

    // info (left)
    const info = h("div", { class: "info" });
    info.append(h("div", { class: "tags" },
      h("span", { class: "cat" }, h("span", { "aria-hidden": "true", text: cat.emoji }), cat.key),
      p.example ? h("span", { class: "example", text: "예시" }) : null));
    info.append(h("h3", { class: "name" }, title, !p.name && (p.menus || []).length ? h("span", { class: "undecided", text: "식당 미정" }) : null));
    if (p.catchtable || p.tabling) info.append(h("div", { class: "book" },
      p.catchtable ? h("a", { class: "ct-btn", href: p.catchtable, target: "_blank", rel: "noopener noreferrer", "aria-label": `${title} 캐치테이블에서 예약하기` }, svg(ICON.cal), "캐치테이블 예약") : null,
      p.tabling ? h("a", { class: "ct-btn tb", href: p.tabling, target: "_blank", rel: "noopener noreferrer", "aria-label": `${title} 테이블링에서 ${p.tablingMode === "예약" ? "예약하기" : "줄서기"}` }, svg(p.tablingMode === "예약" ? ICON.cal : ICON.queue), p.tablingMode === "예약" ? "테이블링 예약" : "테이블링 줄서기") : null));
    const where = p.gu || "";
    if (where || p.area) {
      const km = filt.sort === "near" ? kmFromSangam(p) : null;
      info.append(h("p", { class: "where" }, svg(ICON.pin), where ? h("span", { text: where }) : null, p.area ? h("span", { class: "area", text: p.area }) : null,
        km != null ? h("span", { class: "dist", text: `상암에서 ${km < 10 ? km.toFixed(1) : Math.round(km)}km` }) : null));
    }
    const menuList = (p.menus || []).filter(m => m !== title);
    if (menuList.length) info.append(h("ul", { class: "menus", "aria-label": "먹고 싶은 메뉴" }, ...menuList.map(m => h("li", { text: m }))));
    const facts = h("dl", { class: "facts" });
    if (p.wantDate || p.wantWhen) {
      facts.append(h("dt", { text: "언제" }));
      if (p.wantDate) facts.append(h("dd", null, fmtDate(p.wantDate), p.wantWhen ? h("small", { text: p.wantWhen }) : null));
      else facts.append(h("dd", { text: p.wantWhen }));
    }
    if (facts.childElementCount) info.append(facts);
    if (p.memo) info.append(h("p", { class: "memo", text: p.memo }));
    el.append(info);

    // photo (right), taped on
    const thumb = h("div", { class: "thumb" }, h("span", { class: "emoji", "aria-hidden": "true", text: cat.emoji }));
    const src = photoSrc(p);
    if (src) {
      const img = h("img", { src, alt: `${title} 사진`, loading: "lazy", decoding: "async", referrerpolicy: "no-referrer" });
      img.addEventListener("error", () => img.remove());
      thumb.append(img);
    }
    const snap = h("div", { class: "snap" }, thumb, h("span", { class: "tape", "aria-hidden": "true" }));
    if (p.wantDate) {
      const n = daysUntil(p.wantDate);
      snap.append(h("span", { class: "sticker" + (n === 0 ? " today" : n < 0 ? " past" : ""), text: n === 0 ? "오늘" : n > 0 ? `D-${n}` : "지남", title: fmtDate(p.wantDate) }));
    }
    el.append(snap);

    // footer
    const left = h("div", { class: "left" });
    if (go) left.append(h("span", { class: "go", "aria-hidden": "true" }, svg(ICON.pin), h("span", { text: "지도" })));
    if (p.reel) left.append(h("a", { class: "reel", href: p.reel, target: "_blank", rel: "noopener noreferrer", "aria-label": `${title} ${reelLabel(p.reel)} 보기` }, svg(ICON.play), reelLabel(p.reel)));
    const right = h("div", { class: "right" });
    if (!readOnly) {
      const del = h("button", { class: "icon-btn", type: "button", "aria-label": `${title} 지우기` }, svg(ICON.trash));
      let armed = 0;
      del.addEventListener("click", async () => {
        if (!armed) {
          del.classList.add("confirm");
          del.replaceChildren("지우기");
          del.setAttribute("aria-label", `한 번 더 누르면 ${withObj(title)} 지워요`);
          armed = setTimeout(() => { armed = 0; del.classList.remove("confirm"); del.replaceChildren(svg(ICON.trash)); del.setAttribute("aria-label", `${title} 지우기`); }, 3000);
          return;
        }
        clearTimeout(armed);
        del.disabled = true;
        try {
          await store.remove(p.id);
          if (p.photoId && assets) assets.delete(p.photoId).catch(() => {});
          showToast(`${withObj(title)} 지웠어요`);
        } catch { del.disabled = false; showToast("지우지 못했어요. 다시 눌러 주세요."); }
      });
      right.append(
        h("button", { class: "visit-btn", type: "button", "aria-label": `${title} 다녀왔어요로 옮기기`, onclick: () => markVisited(p) }, svg(ICON.check), "다녀왔어요"),
        h("button", { class: "icon-btn", type: "button", "aria-label": `${title} 고치기`, onclick: () => openEditor(p) }, svg(ICON.edit)), del);
    }
    el.append(h("div", { class: "foot" }, left, right));
    return el;
  }

  function render() {
    const all = store.mode === "locked" ? [] : store.items;
    const visited = all.filter(p => p.visited);
    const items = all.filter(p => !p.visited);
    $("tally").replaceChildren(h("b", { text: String(items.filter(p => !p.example).length) }), "곳 담음");
    renderVisited(visited);
    document.body.classList.toggle("has-items", items.length > 0);
    rebuildFilterOptions(items);
    const shown = applyFilters(items);
    $("grid").replaceChildren(...shown.map(card));
    fresh = new Set();
    $("filters").hidden = store.mode === "locked";

    const empty = $("empty");
    const say = (title, text) => { empty.hidden = false; $("emptyTitle").textContent = title; $("emptyText").textContent = text; };
    if (store.mode === "loading") say("불러오는 중", "담아둔 맛집을 가져오고 있어요.");
    else if (store.mode === "locked") empty.hidden = true;
    else if (!items.length && visited.length) say("담아 둔 곳을 다 다녀왔어요", "새로 먹고 싶은 곳을 위 칸에 적어 보세요. 다녀온 곳은 ‘다녀왔어요’에서 볼 수 있어요.");
    else if (!items.length) say("아직 담은 곳이 없어요", "위 칸에 먹고 싶은 걸 적고 ‘정리해서 담기’를 눌러 보세요. 네이버지도 링크를 넣으면 카드를 눌러 바로 열 수 있어요.");
    else if (!shown.length) say("조건에 맞는 곳이 없어요", "지역이나 종류를 바꾸거나 검색어를 지워 보세요.");
    else empty.hidden = true;

    $("resultbar").hidden = !items.length && !visited.length;
    const filtered = filt.region || filt.cat || filt.q;
    $("resultCount").replaceChildren(
      filtered ? `${items.length}곳 중 ${shown.length}곳` : `전체 ${items.length}곳`,
      filtered ? h("button", { class: "linkbtn", type: "button", text: "필터 지우기", onclick: clearFilters }) : "");
    const ex = items.filter(p => p.example);
    const extra = $("resultExtra");
    extra.replaceChildren();
    if (visited.length) extra.append(h("button", { class: "linkbtn", type: "button", text: `다녀왔어요 ${visited.length}`, onclick: openVisited }));
    if (store.mode === "server") extra.append(h("button", { class: "linkbtn", type: "button", text: "같이 쓸 링크 보내기", onclick: shareInvite }));
    if (ex.length && !readOnly) {
      const btn = h("button", { class: "linkbtn danger", type: "button", text: `예시 ${ex.length}개 지우기` });
      let armed = 0;
      btn.addEventListener("click", async () => {
        if (!armed) {
          btn.textContent = "한 번 더 누르면 지워요";
          armed = setTimeout(() => { armed = 0; btn.textContent = `예시 ${ex.length}개 지우기`; }, 3500);
          return;
        }
        clearTimeout(armed);
        btn.disabled = true;
        for (const p of ex) await store.remove(p.id).catch(() => {});
        showToast("예시 카드를 지웠어요");
      });
      extra.append(btn);
    }
  }
  // A link that opens the app without the password screen (the password rides in the #hash, never sent to the server)
  async function shareInvite() {
    const pass = getPass();
    const url = location.origin + "/" + (pass ? "#pass=" + encodeURIComponent(pass) : "");
    if (navigator.share) {
      try { await navigator.share({ title: "Eater 먹킷리스트", text: "같이 먹고 싶은 곳 담아요", url }); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    try {
      await navigator.clipboard.writeText(url);
      showToast("링크를 복사했어요. 카톡에 붙여 넣어 보내세요.");
    } catch {
      showToast(url);
    }
  }
  function clearFilters() {
    filt.region = ""; filt.cat = ""; filt.q = "";
    $("fRegion").value = ""; $("fCat").value = ""; $("fQ").value = "";
    render();
  }

  // ---------- editor ----------
  const ed = $("editor");
  let editing = null;
  let edPhoto;
  $("edCat").append(...CATS.map(c => h("option", { value: c.key, text: `${c.emoji} ${c.key}` })));
  $("edCity").append(h("option", { value: "", text: "선택 안 함" }), ...CITIES.map(c => h("option", { value: c, text: c })));

  function edPreview(src, catKey) {
    $("edPreview").replaceChildren(src ? h("img", { src, alt: "", referrerpolicy: "no-referrer" }) : (CAT[catKey] || CAT["기타"]).emoji);
  }
  function openEditor(p) {
    editing = p;
    edPhoto = undefined;
    $("edName").value = p.name || "";
    $("edCat").value = CAT[p.category] ? p.category : "기타";
    $("edLink").value = p.link || "";
    $("edReel").value = p.reel || "";
    $("edMenus").value = (p.menus || []).join(", ");
    $("edCity").value = CITIES.includes(p.city) ? p.city : "";
    $("edGu").value = p.gu || "";
    $("edDate").value = p.wantDate || "";
    $("edWhen").value = p.wantWhen || "";
    $("edMemo").value = p.memo || "";
    edPreview(photoSrc(p), p.category);
    if (typeof ed.showModal === "function") ed.showModal(); else ed.setAttribute("open", "");
  }
  $("edPhoto").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    edPhoto = f;
    edPreview(URL.createObjectURL(f), $("edCat").value);
  });
  $("edPhotoClear").addEventListener("click", () => { edPhoto = null; edPreview("", $("edCat").value); });
  $("edCat").addEventListener("change", () => { if (edPhoto === null || (edPhoto === undefined && !photoSrc(editing))) edPreview("", $("edCat").value); });
  $("edCancel").addEventListener("click", () => ed.close());
  $("edForm").addEventListener("submit", async e => {
    e.preventDefault();
    if (!editing) return;
    const p = editing;
    const save = $("edSave");
    save.disabled = true;
    save.textContent = "저장 중…";
    try {
      const city = $("edCity").value;
      const gu = $("edGu").value.trim();
      const patch = {
        name: $("edName").value.trim(),
        category: $("edCat").value,
        link: safeUrl($("edLink").value.trim()),
        reel: safeUrl($("edReel").value.trim()),
        menus: $("edMenus").value.split(/[,，、]/).map(s => s.trim()).filter(Boolean).slice(0, 6),
        city: city || (SEOUL_AREA[gu] ? "서울" : ""),
        gu,
        wantDate: $("edDate").value || null,
        wantWhen: $("edWhen").value.trim(),
        memo: $("edMemo").value.trim(),
        example: false,
      };
      patch.area = areaOf(patch.city, patch.gu, "");
      const oldPhotoId = p.photoId;
      if (edPhoto) Object.assign(patch, await storePhoto(edPhoto), { photoUrl: null });
      else if (edPhoto === null) Object.assign(patch, { photoId: null, photoKey: null, photoData: null, photoUrl: null });
      await store.update(p.id, patch);
      if (edPhoto !== undefined && oldPhotoId && assets) assets.delete(oldPhotoId).catch(() => {});
      ed.close();
      showToast("저장했어요");
    } catch {
      showToast("저장하지 못했어요. 다시 눌러 주세요.");
    } finally {
      save.disabled = false;
      save.textContent = "저장";
    }
  });

  if (!document.documentElement.lang) document.documentElement.lang = "ko";
  store.on(render);
  render();
  boot();
})();
</script>
